[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Send the default Netlify address to the real domain.
[[redirects]]
  from = "https://phalinx.netlify.app/*"
  to = "https://phalinx.space/:splat"
  status = 301
  force = true
